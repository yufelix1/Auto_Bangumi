requires-python = ">=3.14"
dependencies = ["autobangumi-sdk==0.6.0"]

[tool.uv.sources]
autobangumi-sdk = { path = "../autobangumi_sdk-0.6.0-py3-none-any.whl" }

[dependency-groups]
